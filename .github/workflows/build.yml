name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets version tags publish a GitHub Release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Btrfs tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs

      - name: Rewind engine tests (plain folders and a real Btrfs volume)
        run: sudo python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Interface test in headless Chrome
        run: |
          python3 -m hindsightd --dev --data /tmp/hs-data --interval 30 &
          cd tools/e2e
          npm install --no-audit --no-fund
          node rewind.test.mjs http://127.0.0.1:7070 screenshots

      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: tools/e2e/screenshots
          retention-days: 7

  image:
    name: Emulator image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs qemu-utils qemu-system-x86 zip

      - name: Allow hardware acceleration for the boot test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build the image
        run: sudo ./image/build.sh dist

      - name: Boot it and run the on-device self-test
        run: sudo ./image/boot-test.sh dist 900

      - name: Save boot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            dist/boot-serial.log
            dist/boot-screen.png
            dist/kernel-features.txt
          retention-days: 7

      - name: Save the emulator build
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-emulator
          path: |
            dist/hindsight.qcow2
            dist/vmlinuz
            dist/initramfs
            dist/run-*
            dist/README.txt
          compression-level: 0
          retention-days: 3

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo chown -R "$USER" dist
          cd dist && zip -0 ../hindsight-emulator-${{ github.ref_name }}.zip \
            hindsight.qcow2 vmlinuz initramfs run-linux.sh run-mac.sh run-windows.bat README.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hindsight-emulator-${{ github.ref_name }}.zip
          body: |
            Download the zip, unzip it, install QEMU, and run `run-windows.bat`,
            `run-mac.sh` or `run-linux.sh`. See README.txt inside.
